name: Bump version

# One-click release from the GitHub UI:
#   Actions -> Bump version -> Run workflow -> choose patch / minor / major
#
# patch: bug fixes and copy changes       1.2.0 -> 1.2.1
# minor: new features, backwards compatible  1.2.0 -> 1.3.0
# major: breaking changes or a new era      1.2.0 -> 2.0.0
#
# The workflow runs the test suite, bumps package.json + package-lock.json +
# the Go scanner version + CHANGELOG, commits, tags, pushes, and publishes a
# GitHub Release with generated notes.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Preview the version change without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Bump version
        id: bump
        run: node scripts/release.mjs "${{ inputs.bump }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit, tag, push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "seaworthy-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "Seaworthy v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: would release v${{ steps.bump.outputs.version }} (${{ inputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released v${{ steps.bump.outputs.version }} (${{ inputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
            echo "Tag: v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
